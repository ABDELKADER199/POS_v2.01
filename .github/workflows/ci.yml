name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v3
        with:
          php-version: '8.2'
          extensions: zip, pdo_sqlite
          coverage: none

      - name: Setup Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install backend dependencies
        working-directory: web/backend
        run: |
          composer install --no-progress --no-suggest --prefer-dist

      - name: Prepare SQLite database
        working-directory: web/backend
        run: |
          php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"

      - name: Set up environment
        working-directory: web/backend
        run: |
          cp .env.example .env || true
          php artisan key:generate

      - name: Run migrations
        working-directory: web/backend
        run: php artisan migrate --force

      - name: Run backend tests
        working-directory: web/backend
        run: php artisan test --verbose

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache frontend/npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            web/frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web/frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: |
          npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: web/frontend
        run: |
          npm run build --if-present

      - name: Run frontend unit tests
        working-directory: web/frontend
        run: |
          npm run test --if-present --silent

  e2e-tests:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v3
        with:
          php-version: '8.2'
          extensions: zip, pdo_sqlite

      - name: Install backend dependencies
        working-directory: web/backend
        run: |
          composer install --no-progress --no-suggest --prefer-dist

      - name: Prepare SQLite and migrate
        working-directory: web/backend
        run: |
          php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"
          cp .env.example .env || true
          php artisan key:generate
          php artisan migrate --force

      - name: Start Laravel (background)
        working-directory: web/backend
        run: |
          nohup php artisan serve --port=8000 > laravel.log 2>&1 &

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache frontend/npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            web/frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web/frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: |
          npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: web/frontend
        run: |
          npm run build --if-present

      - name: Install Playwright browsers
        working-directory: web/frontend
        run: |
          npm i --no-audit --no-fund @playwright/test
          npx playwright install --with-deps

      - name: Start frontend dev server (background)
        working-directory: web/frontend
        run: |
          nohup npm start > frontend.log 2>&1 &

      - name: Wait for services
        run: |
          # wait for frontend
          for i in {1..30}; do curl -sS --fail http://localhost:4200 && break || sleep 1; done
          # wait for backend
          for i in {1..30}; do curl -sS --fail http://localhost:8000/api/health || true && break || sleep 1; done

      - name: Run Playwright E2E
        working-directory: web/frontend
        run: |
          npx playwright test --project=chromium --reporter=list
