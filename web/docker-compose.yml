services:
  mysql:
    image: mysql:8.4
    container_name: hyperpos-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stocks
      MYSQL_USER: hyperpos
      MYSQL_PASSWORD: hyperpos
    volumes:
      - hyperpos_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hyperpos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hyperpos_redis_data:/data

volumes:
  hyperpos_mysql_data:
  hyperpos_redis_data:
