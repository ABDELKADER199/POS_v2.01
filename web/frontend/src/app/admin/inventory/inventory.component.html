<div class="dashboard-container">
  <div class="sidebar">
    <div class="brand">HyperPOS Admin</div>
    <button class="nav-link" routerLink="/admin/products">📦 إدارة المنتجات</button>
    <button class="nav-link" routerLink="/admin/categories">📁 تصنيفات الأقسام</button>
    <button class="nav-link active">📊 الجرد والتسويات</button>
    <button class="nav-link" routerLink="/admin/purchases">🛒 المشتريات والموردين</button>
    <button class="nav-link" routerLink="/admin/users">👥 المستخدمين والصلاحيات</button>
    <div style="flex:1"></div>
    <button class="nav-link" style="color: #17A65A; font-weight: 900;" routerLink="/cashier">🛒 العودة للكاشير</button>
  </div>

  <div class="main-content">
    <div class="header">
      <h1 class="page-title">📊 الجرد وتسويات المخزون</h1>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <input type="text" class="search-input" placeholder="ابحث باسم المنتج أو الباركود..." 
               [(ngModel)]="searchQuery" (keyup.enter)="load()">
      </div>
      <button class="btn btn-primary" (click)="load()">🔍 بحث</button>
    </div>

    <div class="table-container">
      <table class="admin-table">
        <thead>
          <tr>
            <th>كود الصنف</th>
            <th>اسم المنتج</th>
            <th>الباركود</th>
            <th>الرصيد الدفتري</th>
            <th style="width: 200px;">الجرد الفعلي</th>
            <th>السبب</th>
            <th style="text-align: center; width: 120px;">تأكيد</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="products.length === 0">
            <td colspan="7" style="text-align: center; padding: 30px;">لا توجد نتائج مطابقة.</td>
          </tr>
          <tr *ngFor="let p of products">
            <td style="color: #fff; font-weight: bold;">{{ p.product_code || '-' }}</td>
            <td style="color: #fff; font-weight: 800;">{{ p.product_name }}</td>
            <td>{{ p.barcode || '-' }}</td>
            <td style="color: #2F6BFF; font-weight: 900; font-size: 16px;">{{ p.quantity_in_stock }}</td>
            <td>
              <input type="number" class="form-input" [(ngModel)]="p.new_quantity" style="width: 100px; padding: 6px 10px;">
            </td>
            <td>
              <input type="text" class="form-input" [(ngModel)]="p.notes" placeholder="تالف/عجز..." style="width: 130px; padding: 6px 10px;">
            </td>
            <td style="text-align: center;">
              <button class="btn btn-success" style="padding: 6px 14px; font-size: 12px;" (click)="adjust(p)">✅ تأكيد</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
